myservice:
  image: org/myservice:tag
  env_file:
    - ../services/myservice/.env
  volumes:
    - ../services/myservice/data:/data
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  restart: unless-stopped

myapp:
  build:
    context: ../services/myapp
  image: myapp:${BUILD_VERSION:-local}
  env_file:
    - ../services/myapp/.env
  volumes:
    - ../services/myapp/data:/app/data
  expose:
    - "8000"
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/health"]
    interval: 30s
    timeout: 15s
    retries: 5
    start_period: 300s
  restart: unless-stopped
