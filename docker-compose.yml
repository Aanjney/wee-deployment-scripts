name: edge

services:
  linkwarden-postgres:
    image: postgres:16-alpine
    env_file:
      - ../services/linkwarden/.env
    volumes:
      - ../services/linkwarden/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  linkwarden-meilisearch:
    image: getmeili/meilisearch:v1.12.8
    env_file:
      - ../services/linkwarden/.env
    volumes:
      - ../services/linkwarden/meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    env_file:
      - ../services/linkwarden/.env
    environment:
      MEILI_HOST: http://linkwarden-meilisearch:7700
    volumes:
      - ../services/linkwarden/data:/data/data
    expose:
      - "3000"
    depends_on:
      - linkwarden-postgres
      - linkwarden-meilisearch
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    env_file:
      - ../services/vaultwarden/.env
    volumes:
      - ../services/vaultwarden/data:/data
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  memos:
    image: neosmemo/memos:stable
    env_file:
      - ../services/memos/.env
    volumes:
      - ../services/memos/data:/var/opt/memos
    expose:
      - "5230"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5230/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  beszel:
    image: henrygd/beszel
    env_file:
      - ../services/beszel/.env
    expose:
      - "8090"
    volumes:
      - ../services/beszel/data:/beszel_data
      - ../services/beszel/socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  beszel-agent:
    image: henrygd/beszel-agent
    network_mode: host
    env_file:
      - ../services/beszel/.env
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
    volumes:
      - ../services/beszel/agent_data:/var/lib/beszel-agent
      - ../services/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ../services/pysparkassist/qdrant_data:/qdrant/storage
    expose:
      - "6333"
    restart: unless-stopped

  pysparkassist:
    build:
      context: ../services/pysparkassist
    image: pysparkassist:${BUILD_VERSION:-local}
    env_file:
      - ../services/pysparkassist/.env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ../services/pysparkassist/data:/app/data
    expose:
      - "8000"
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - linkwarden
      - vaultwarden
      - memos
      - beszel
      - pysparkassist
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
